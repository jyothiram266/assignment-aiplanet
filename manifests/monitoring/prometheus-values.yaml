server:
  retention: 24h
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1024Mi
  persistentVolume:
    size: 2Gi

alertmanager:
  enabled: false

pushgateway:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

kube-state-metrics:
  enabled: true
