apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-serving-code
  namespace: default
data:
  server.py: |
    import os
    import time
    from fastapi import FastAPI
    from pydantic import BaseModel

    app = FastAPI(title="llama.cpp mock server")
    VERSION = os.getenv("MODEL_VERSION", "v1.0.0")

    class ChatRequest(BaseModel):
        messages: list

    @app.get("/health")
    async def health():
        return {"status": "ok", "version": VERSION}

    @app.post("/v1/chat/completions")
    async def chat_completions(req: ChatRequest):
        return {
            "id": f"chatcmpl-doks-{VERSION}",
            "object": "chat.completion",
            "created": int(time.time()),
            "model": f"qwen-quantized-{VERSION}",
            "choices": [{
                "index": 0,
                "message": {"role": "assistant", "content": f"Response from {VERSION} on DOKS cluster. Electronic items can be returned within 30 days."},
                "finish_reason": "stop"
            }],
            "usage": {"prompt_tokens": 10, "completion_tokens": 20, "total_tokens": 30}
        }

    if __name__ == "__main__":
        import uvicorn
        uvicorn.run(app, host="0.0.0.0", port=8080)
