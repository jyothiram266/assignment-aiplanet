apiVersion: v1
kind: Service
metadata:
  name: llm-serving-v1
  namespace: default
  labels:
    app: llm-serving
    version: v1
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: llm-serving
    version: v1
