name: Hybrid LLMOps Platform CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Validate Manifests & Run Gateway Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r gateway-app/requirements.txt
        pip install requests pytest

    - name: Run Gateway Unit Tests
      run: |
        python -m pytest gateway-app/

    - name: Validate Terraform Syntax
      run: |
        cd terraform
        terraform init -backend=false
        terraform validate

    - name: Validate Kubernetes YAML Syntax
      run: |
        python -c "import yaml, glob; [yaml.safe_load_all(open(f)) for f in glob.glob('manifests/**/*.yaml', recursive=True)]"

  build-and-push-docker-registry:
    name: Build & Push Gateway Image to Docker Registry
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.DOCKER_REGISTRY || '' }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./gateway-app
        file: ./gateway-app/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/llm-gateway:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/llm-gateway:latest
